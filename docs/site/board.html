<link rel="stylesheet" href="style/fonts.css"><link rel="stylesheet" href="style/tokens.css"><link rel="stylesheet" href="style/base.css"><link rel="stylesheet" href="src/circuit.css">
<style>
/* Extensions propres à la documentation Kwa. Uniquement les tokens du design system : aucune couleur ajoutée. */
html{scroll-behavior:smooth;overflow-x:clip}
section{scroll-margin-top:84px}
.kw-hero{grid-template-columns:minmax(0,1fr)}
.kd-term{min-width:0}
.kd-eyebrow{font:400 12px/1.4 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--kw-mut);margin-bottom:20px}
.kd-lead{max-width:68ch;color:var(--kw-body);font-size:clamp(15px,1.4vw,17px);margin:0}
.kd-head .kw-section-title{margin-bottom:20px}
.kd-section{padding-top:128px}
.kd-bar{position:sticky;top:0;z-index:20;padding-block:14px;background:var(--kw-glass);backdrop-filter:blur(8px);border-bottom:1px solid var(--kw-rule-soft)}
.kd-bar .row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.kd-brand{display:flex;align-items:center;gap:14px;text-decoration:none;white-space:nowrap}
.kd-theming, .kd-theming *, .kd-theming *::before, .kd-theming *::after{transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease !important}
.kd-theme{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--kw-rule);background:transparent;color:var(--kw-fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.kd-theme:hover{background:var(--kw-raise)}.kd-theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.kd-theme .i-sun{display:none}html[data-theme="dark"] .kd-theme .i-sun{display:block}html[data-theme="dark"] .kd-theme .i-moon{display:none}
.kd-word{font:700 20px/1 Geist,system-ui,sans-serif;letter-spacing:-.02em}.kd-word--big{font-size:30px}
.kd-brand span{font:400 12px 'Geist Mono',monospace;letter-spacing:.08em;color:var(--kw-mut)}
.kd-nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.kd-nav a{font:400 12px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--kw-body);white-space:nowrap}
.kd-nav a:hover{color:var(--kw-fg)}
.kd-nav::-webkit-scrollbar{display:none}
.kd-code{margin:0;background:var(--kw-brick);border:1px solid var(--kw-rule);border-radius:12px;padding:16px 18px;overflow-x:auto;font:13px/1.7 'Geist Mono',monospace;color:var(--kw-fg)}
.kd-code .p{color:var(--kw-mut)} .kd-code .s{color:var(--kw-green)}
.kd-term{margin-top:40px;max-width:760px}
.kd-term .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:400 11px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--kw-mut)}
.kd-copy{font:400 11px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:var(--kw-body);border:1px solid var(--kw-rule);border-radius:999px;padding:6px 12px;min-height:30px}
.kd-copy:hover{background:var(--kw-raise)}
code{font:.9em 'Geist Mono',monospace;background:var(--kw-tint);border:1px solid var(--kw-rule-soft);border-radius:6px;padding:1px 6px}
.kd-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kd-stat{padding:24px;border:1px solid var(--kw-rule);border-radius:20px}
.kd-stat .n{font:650 clamp(30px,3.4vw,40px)/1 Geist,system-ui,sans-serif;letter-spacing:-.02em}
.kd-stat .l{margin-top:10px;color:var(--kw-body);font-size:14px}
.kd-grid{display:grid;gap:12px}
.kd-g2{grid-template-columns:repeat(2,minmax(0,1fr))}.kd-g3{grid-template-columns:repeat(3,minmax(0,1fr))}.kd-g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kd-card{min-width:0;padding:24px;border:1px solid var(--kw-rule);border-radius:20px;background:transparent;text-align:left;font:inherit;color:inherit}
.kd-card h3{font:500 18px/1.4 Geist,sans-serif;margin:0 0 12px}
.kd-card p{color:var(--kw-body);font-size:14px;line-height:1.625;margin:0}
.kd-flow{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;align-items:start}
.kd-steps{display:grid;gap:8px}
.kd-step{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:10px;text-align:left;min-height:44px;padding:10px 16px;border:1px solid var(--kw-rule);border-radius:12px;background:transparent;color:var(--kw-fg);font:500 14px Geist,sans-serif;transition:background .2s ease,color .2s ease}
.kd-step i{font:400 11px 'Geist Mono',monospace;color:var(--kw-mut);font-style:normal}
.kd-step:hover{background:var(--kw-raise)}
.kd-step[aria-selected="true"]{background:var(--kw-invert-bg);color:var(--kw-invert-fg);border-color:transparent}
.kd-step[aria-selected="true"] i{color:var(--kw-invert-fg);opacity:.7}
.kd-panel{border:1px solid var(--kw-rule);border-radius:20px;padding:32px;min-height:420px}
.kd-panel h3{font:650 clamp(22px,2.4vw,28px)/1.2 Geist,system-ui,sans-serif;letter-spacing:-.015em;margin:6px 0 16px}
.kd-panel h3 strong{font-weight:700}
.kd-panel .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.kd-panel h4,.kd-detail h4{margin:0 0 8px;font:400 11px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--kw-mut)}
.kd-panel ul{margin:0;padding-left:18px;color:var(--kw-body);font-size:14px;line-height:1.7}
.kd-panel p.v{font:14px/1.6 'Geist Mono',monospace;margin:0}
.kd-tools{display:flex;flex-wrap:wrap;gap:8px;margin:32px 0 20px;align-items:center}
.kd-chip{font:400 12px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:var(--kw-body);border:1px solid var(--kw-rule);border-radius:999px;padding:9px 14px;min-height:36px;transition:background .2s ease}
.kd-chip:hover{background:var(--kw-raise)}
.kd-chip[aria-pressed="true"]{background:var(--kw-invert-bg);color:var(--kw-invert-fg);border-color:transparent}
.kd-search{flex:1;min-width:200px;min-height:36px;background:transparent;border:1px solid var(--kw-rule);border-radius:999px;color:var(--kw-fg);padding:8px 16px;font:13px 'Geist Mono',monospace}
.kd-table{border:1px solid var(--kw-rule);border-radius:20px;overflow:hidden}
.kd-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 20px;padding:16px 20px;border-top:1px solid var(--kw-rule-soft);align-items:start}
.kd-row:first-child{border-top:0}
.kd-pill{display:inline-flex;align-items:center;gap:8px;padding:3px 10px;border-radius:999px;border:1px solid var(--kw-rule);font:400 11px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.kd-pill.deny{background:var(--kw-invert-bg);color:var(--kw-invert-fg);border-color:transparent}
.kd-pill.ask{border-color:var(--kw-fg)}
.kd-pill.allow{color:var(--kw-green);border-color:currentColor}
.kd-row .cmd{font:13px/1.55 'Geist Mono',monospace;white-space:pre-wrap;word-break:break-word}
.kd-row .meta{font:400 11px 'Geist Mono',monospace;letter-spacing:.06em;color:var(--kw-mut);text-transform:uppercase;margin-left:10px}
.kd-row .why{grid-column:2;color:var(--kw-body);font-size:14px}
.kd-note{margin-top:14px;font:400 12px 'Geist Mono',monospace;letter-spacing:.04em;color:var(--kw-mut)}
.kd-legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin:0 0 26px;font:400 11px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--kw-body)}
.kd-legend span{display:inline-flex;align-items:center;gap:9px}
.sw{width:24px;height:14px;display:inline-block;border:1px solid var(--kw-fg);border-radius:3px}
.sw.hook{border-style:dashed}.sw.agent{border-style:double;border-width:4px}.sw.garde{border:2px solid var(--kw-fg)}.sw.humain{background:var(--kw-invert-bg);border-radius:10px;border-color:transparent}
.kd-track{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:34px 36px}
.kd-brick{position:relative;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--kw-fg);border-radius:12px;padding:16px 18px;transition:translate .2s ease,background .2s ease}
.kd-brick:hover{translate:0 -2px;background:var(--kw-tint)}
.kd-brick[aria-pressed="true"]{background:var(--kw-raise)}
.kd-brick .ty{display:block;margin-bottom:8px;font:400 11px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--kw-mut)}
.kd-brick b{display:block;font:500 16px/1.35 Geist,sans-serif;margin-bottom:6px}
.kd-brick .d{display:block;font-size:13.5px;line-height:1.55;color:var(--kw-body)}
.kd-brick .when{display:block;margin-top:10px;font:400 11px/1.5 'Geist Mono',monospace;letter-spacing:.04em;color:var(--kw-mut)}
.kd-brick.hook{border:1px dashed var(--kw-fg)}
.kd-brick.agent{border:4px double var(--kw-fg);padding:13px 15px}
.kd-brick.garde{border:2px solid var(--kw-fg)}
.kd-brick.humain{background:var(--kw-invert-bg);color:var(--kw-invert-fg);border-color:transparent;border-radius:28px;padding:18px 22px}
.kd-brick.humain .ty,.kd-brick.humain .d,.kd-brick.humain .when{color:var(--kw-invert-fg);opacity:.75}
.kd-brick:not(:last-child)::after{content:"→";position:absolute;right:-28px;top:50%;translate:0 -50%;font:16px 'Geist Mono',monospace;color:var(--kw-mut)}
.kd-detail{margin-top:26px;border:1px solid var(--kw-rule);border-radius:20px;padding:22px 26px;min-height:92px}
.kd-detail p{margin:0;color:var(--kw-body);font-size:14.5px;line-height:1.65}
.kd-sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.kd-sk .kd-card h3{font:500 16px 'Geist Mono',monospace;margin-top:10px}
.kd-fam{font:400 11px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--kw-mut)}
.kd-origin{display:inline-flex;align-items:center;gap:8px;margin:14px 6px 0 0;padding:3px 12px 3px 3px;border-radius:999px;background:var(--kw-invert-bg);color:var(--kw-invert-fg);font:10px/1.7 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.kd-origin img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.kd-origin.kwa{padding:3px 12px}
.kd-av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--kw-rule);margin-bottom:14px;display:block}
.kd-origin.kwa{background:transparent;color:var(--kw-fg);border:1px solid var(--kw-fg)}
.kd-src{display:grid;gap:12px}
.kd-src .kd-card{display:grid;grid-template-columns:230px minmax(0,1fr);gap:8px 32px}
.kd-src a{display:inline-block;margin-top:8px;font:12px 'Geist Mono',monospace;color:var(--kw-body);word-break:break-all}
.kd-tag{display:inline-block;margin:10px 6px 0 0;padding:3px 9px;border:1px solid var(--kw-rule);border-radius:999px;font:11px 'Geist Mono',monospace;color:var(--kw-body)}
.kd-loop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:34px}
.kd-node{position:relative;padding:20px;border:1px solid var(--kw-rule);border-radius:20px}
.kd-node:not(:last-child)::after{content:"→";position:absolute;right:-28px;top:50%;translate:0 -50%;font:16px 'Geist Mono',monospace;color:var(--kw-mut)}
.kd-node b{display:block;font:500 15px Geist,sans-serif;margin-bottom:8px}.kd-node span{display:block;font-size:13.5px;line-height:1.6;color:var(--kw-body)}
.kd-gate{margin-top:12px;border:1px dashed var(--kw-dim);border-radius:20px;padding:18px 22px;display:flex;gap:16px;align-items:baseline;color:var(--kw-body);font-size:14px}
.kd-gate b{font:400 12px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--kw-fg);white-space:nowrap}
.kd-ob{display:grid;gap:12px}
.kd-ob .item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px;border:1px solid var(--kw-rule);border-radius:20px}
.kd-ob .num{font:650 28px/1 Geist,system-ui,sans-serif;letter-spacing:-.02em;color:var(--kw-dim)}
.kd-ob h3{font:500 18px Geist,sans-serif;margin:0 0 6px}.kd-ob p{margin:0 0 14px;color:var(--kw-body);font-size:14px}
.kd-wrap{border:1px solid var(--kw-rule);border-radius:20px;overflow-x:auto}
.kd-wrap table{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}
.kd-wrap th{font:400 11px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--kw-mut);text-align:left;padding:14px 20px;border-bottom:1px solid var(--kw-rule)}
.kd-wrap td{padding:14px 20px;border-top:1px solid var(--kw-rule-soft);vertical-align:top;color:var(--kw-body);line-height:1.6}
.kd-wrap td:first-child{color:var(--kw-fg);font-weight:500}
details{border-top:1px solid var(--kw-rule);padding:20px 0}
details summary{cursor:pointer;font:500 18px Geist,sans-serif;min-height:44px;display:flex;align-items:center}
details p{margin:10px 0 0;color:var(--kw-body);max-width:68ch}
.kd-rv{opacity:1;transform:none}
.js .kd-rv{opacity:0;transform:translateY(18px);transition:opacity .88s var(--kw-ease),transform .88s var(--kw-ease)}
.js .kd-rv.in{opacity:1;transform:none}
footer.kw-footer{margin-top:128px}
@media (max-width:1023px){.kd-g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kd-nav{display:none}}
@media (max-width:900px){
  .kd-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kd-g2,.kd-g3{grid-template-columns:minmax(0,1fr)}
  .kd-flow{grid-template-columns:minmax(0,1fr)}.kd-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.kd-panel{padding:22px;min-height:0}.kd-panel .cols{grid-template-columns:minmax(0,1fr)}
  .kd-loop{grid-template-columns:minmax(0,1fr)}.kd-node:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-30px;translate:-50% 0}
  .kd-track{grid-template-columns:minmax(0,1fr);gap:34px}.kd-brick:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-30px;translate:-50% 0}
  .kd-src .kd-card{grid-template-columns:minmax(0,1fr)}.kd-row{grid-template-columns:minmax(0,1fr)}.kd-row .why{grid-column:1}
  .kd-ob .item{grid-template-columns:minmax(0,1fr);padding:18px}.kd-ob .num{display:none}.kd-section{padding-top:88px}.kd-brand span{display:none}
}
@media (prefers-reduced-motion:reduce){.js .kd-rv{opacity:1;transform:none;transition:none}}
@media print{.kd-bar{display:none}.js .kd-rv{opacity:1;transform:none}}
</style></head>

<script>
const DATA = window.KWA;
const $ = (s, r=document) => r.querySelector(s);
/* thème : clair par défaut, seul un choix explicite est enregistré */
const root = document.documentElement, tbtn = $('#theme');
function syncTheme(){ const dark = root.dataset.theme==='dark'; tbtn.setAttribute('aria-label', dark ? 'Passer en thème clair' : 'Passer en thème sombre'); }
tbtn.onclick = () => {
  const next = root.dataset.theme==='dark' ? 'light' : 'dark';
  const write = () => { root.dataset.theme = next; try{ localStorage.setItem('kwa-docs-theme', next); }catch(e){} syncTheme(); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return write();
  if (document.startViewTransition) return document.startViewTransition(write);
  root.classList.add('kd-theming'); write(); setTimeout(() => root.classList.remove('kd-theming'), 420);
};
syncTheme();
document.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if(!b) return; navigator.clipboard?.writeText(b.dataset.copy); const o=b.textContent; b.textContent='Copié'; setTimeout(()=>b.textContent=o,1200); });

/* fin du bloc thème */

$('#ver2').textContent = DATA.version; $('#tests').textContent = `${DATA.tests} tests ${DATA.tests_ok ? 'au vert' : 'en échec'}`;
KwaCircuit.mount($('#board-root'));
</script></body></html>
